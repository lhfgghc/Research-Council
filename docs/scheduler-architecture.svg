<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="682" viewBox="0 0 1180 682" role="img" aria-labelledby="title description">
  <title id="title">Research Council orchestration</title>
  <desc id="description">The project workflow moves from independent ideas and literature search to team discussion, shortlisting, per-idea debate, and Markdown delivery. The two discussion stages share a scheduler that reads run state, chooses a model turn or an evidence search, and updates the state for the next turn.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#517566"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", system-ui, sans-serif; fill: #1d332b; }
      .title { font-size: 32px; font-weight: 700; }
      .section { font-size: 20px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 650; }
      .body { font-size: 14px; fill: #456052; }
      .small { font-size: 13px; fill: #456052; }
      .code { font-family: Consolas, "SFMono-Regular", monospace; font-size: 13px; fill: #456052; }
      .phase { fill: #fffdf8; stroke: #b9c9bf; }
      .phase-focus { fill: #dcebe1; stroke: #7a9d87; }
      .line { fill: none; stroke: #517566; stroke-width: 1.8; marker-end: url(#arrow); }
      .guide { fill: none; stroke: #719283; stroke-width: 1.5; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="1180" height="682" rx="18" fill="#f5f7f1"/>
  <text x="32" y="51" class="title">Research Council orchestration</text>
  <text x="34" y="80" class="body">The workflow advances the project. The scheduler selects each discussion action.</text>

  <g aria-label="Project workflow">
    <rect x="32" y="108" width="166" height="74" rx="10" class="phase"/>
    <text x="48" y="137" class="label">Project setup</text>
    <text x="48" y="161" class="small">Scope, ideas, literature</text>

    <path d="M199 145 H217" class="line"/>
    <rect x="220" y="108" width="166" height="74" rx="10" class="phase-focus"/>
    <text x="236" y="137" class="label">Team discussion</text>
    <text x="236" y="161" class="small">Explore candidates</text>

    <path d="M387 145 H405" class="line"/>
    <rect x="408" y="108" width="166" height="74" rx="10" class="phase"/>
    <text x="424" y="137" class="label">Shortlist</text>
    <text x="424" y="161" class="small">Choose ideas to develop</text>

    <path d="M575 145 H593" class="line"/>
    <rect x="596" y="108" width="166" height="74" rx="10" class="phase-focus"/>
    <text x="612" y="137" class="label">Per-idea debate</text>
    <text x="612" y="161" class="small">Refine and challenge</text>

    <path d="M763 145 H781" class="line"/>
    <rect x="784" y="108" width="166" height="74" rx="10" class="phase"/>
    <text x="800" y="137" class="label">Research decision</text>
    <text x="800" y="161" class="small">Claims and key tests</text>

    <path d="M951 145 H969" class="line"/>
    <rect x="972" y="108" width="176" height="74" rx="10" class="phase"/>
    <text x="988" y="137" class="label">Write and deliver</text>
    <text x="988" y="161" class="small">Markdown proposal</text>
  </g>

  <path d="M303 182 V205 H679 V182 M491 205 V222" class="guide"/>
  <rect x="32" y="222" width="1116" height="390" rx="14" fill="#edf3eb" stroke="#acc1b1"/>
  <text x="56" y="256" class="section">Shared discussion scheduler</text>
  <text x="350" y="255" class="small">Team discussion and per-idea debate</text>

  <g aria-label="Run state">
    <rect x="56" y="331" width="220" height="119" rx="10" class="phase"/>
    <text x="74" y="359" class="label">Read run state</text>
    <text x="74" y="386" class="body">Roster, turns, requests</text>
    <text x="74" y="409" class="body">Objections and evidence</text>
    <text x="74" y="432" class="body">Calls left and reserved</text>
  </g>
  <path d="M277 391 H321" class="line"/>

  <g aria-label="Choose the next action">
    <rect x="324" y="281" width="372" height="224" rx="12" fill="#fffdf8" stroke="#7c9e8b"/>
    <text x="344" y="310" class="label">Choose the next action</text>
    <text x="344" y="333" class="code">plan_next_action</text>
    <path d="M344 348 H676" stroke="#d4e0d5"/>
    <text x="344" y="372" class="body">Check the call reserve and turn limit</text>
    <text x="344" y="395" class="body">Meet turn minimums and refine the method</text>
    <text x="344" y="418" class="body">Weigh requests, objections, and coverage</text>
    <rect x="344" y="451" width="332" height="32" rx="6" fill="#ecf2ea"/>
    <text x="355" y="472" class="small">On a limit or no action, advance the workflow</text>
  </g>

  <path d="M697 320 H751" class="line"/>
  <path d="M697 427 H751" class="line"/>
  <g aria-label="Run a model turn or search for evidence">
    <rect x="754" y="281" width="344" height="78" rx="10" class="phase"/>
    <text x="772" y="310" class="label">Model turn</text>
    <text x="772" y="336" class="body">The gateway counts each provider request</text>
    <rect x="754" y="388" width="344" height="78" rx="10" class="phase"/>
    <text x="772" y="417" class="label">Evidence search</text>
    <text x="772" y="443" class="body">Search arXiv, OpenAlex, and the web</text>
    <path d="M1099 320 H1121 V541 H1101" class="line"/>
    <path d="M1099 427 H1121" fill="none" stroke="#517566" stroke-width="1.8"/>
  </g>

  <g aria-label="Record the result and continue scheduling">
    <rect x="754" y="506" width="344" height="70" rx="10" class="phase-focus"/>
    <text x="772" y="534" class="label">Save and update state</text>
    <text x="772" y="558" class="body">Record turns, objections, evidence, and reasons</text>
    <path d="M753 541 H168 V453" class="line"/>
    <text x="397" y="566" class="small">Read updated state for the next action</text>
  </g>

  <text x="34" y="646" class="body">SQLite stores run state · The workbench streams turns and budget · Markdown stores proposal versions</text>
</svg>
